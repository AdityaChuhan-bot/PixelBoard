name: Build, Test & Publish PixelBoard

concurrency:
  group: pixelboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Verify patches and prepare release assets
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x pixelboard-patches/gradlew

      - name: Run patch tests
        working-directory: pixelboard-patches
        run: ./gradlew :patches:test --no-daemon

      - name: Build Android patch bundle
        working-directory: pixelboard-patches
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Stage stable patch bundle
        run: |
          mkdir -p release-assets
          MPP_FILE="$(find pixelboard-patches/patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$MPP_FILE"
          cp "$MPP_FILE" release-assets/PixelBoard.mpp
          # build.sh consumes this repository-root bundle; ensure tag APK builds
          # apply the exact bundle compiled by this workflow, not a stale copy.
          mkdir -p patches
          cp "$MPP_FILE" patches/PixelBoard.mpp

      - name: Check APK build configuration
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: apk_config
        env:
          BASE_APK_URL: ${{ secrets.GBOARD_APK_URL }}
          KEYSTORE_B64: ${{ secrets.PIXELBOARD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIXELBOARD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIXELBOARD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIXELBOARD_KEY_PASSWORD }}
        run: |
          if [[ -n "$BASE_APK_URL" && -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK build skipped. Configure GBOARD_APK_URL, PIXELBOARD_KEYSTORE_BASE64, PIXELBOARD_KEYSTORE_PASSWORD, PIXELBOARD_KEY_ALIAS, and PIXELBOARD_KEY_PASSWORD secrets."
          fi

      - name: Build signed APK
        if: steps.apk_config.outputs.ready == 'true'
        env:
          BASE_APK_URL: ${{ secrets.GBOARD_APK_URL }}
          KEYSTORE_B64: ${{ secrets.PIXELBOARD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PIXELBOARD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIXELBOARD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIXELBOARD_KEY_PASSWORD }}
        run: |
          mkdir -p input tools/patcher-data
          curl --fail --location --retry 3 --max-time 300 "$BASE_APK_URL" --output input/gboard.apk
          unzip -t input/gboard.apk >/dev/null
          printf '%s' "$KEYSTORE_B64" | base64 --decode > tools/patcher-data/pixelboard.keystore
          PIXELBOARD_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          PIXELBOARD_KEY_ALIAS="$KEY_ALIAS" \
          PIXELBOARD_KEY_PASSWORD="$KEY_PASSWORD" \
            ./build.sh input/gboard.apk
          test -s output/PixelBoard.apk
          cp output/PixelBoard.apk release-assets/PixelBoard.apk

      - name: Upload CI artifacts
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: PixelBoard-build
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
